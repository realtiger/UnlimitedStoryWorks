[package]
name = "UnlimitedStoryWorks"
version = "0.1.0"
edition = "2021"
description = "Unlimited Story Works - Rust Axum Backend"

[[bin]]
name = "unlimitedstoryworks"
path = "src/main.rs"

# ============================================================================
# 1. Web 框架 / 运行时（Axum + Tokio + Tower 中间件）
# ============================================================================
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "process",
    "signal",
    "sync",
    "time",
] }
tower = "0.5"
tower-http = { version = "0.7.0", features = [
    "cors",
    "fs",
    "trace",
    "compression-gzip",
    "compression-br",
    "compression-zstd",
] }
http = "1"
http-body-util = "0.1"

# ============================================================================
# 2. 序列化（YAML / JSON）
# ============================================================================
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

# ============================================================================
# 3. 错误处理
# ============================================================================
anyhow = "1.0.104"
thiserror = "2"

# ============================================================================
# 4. 全局单例 / 工具
# ============================================================================
once_cell = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# ============================================================================
# 5. 时间（chrono 生态）
# ============================================================================
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"

# ============================================================================
# 6. 日志 / Tracing
# ============================================================================
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
    "time",
    "smallvec",
] }
tracing-appender = "0.2.5"

# ============================================================================
# 7. OpenAPI / Swagger UI
# ============================================================================
utoipa = { version = "5.5.0", features = ["chrono", "preserve_order", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
